name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Validate brand manager
        run: python3 scripts/validate.py
      - name: Run tests
        run: python3 -m unittest discover -s tests
